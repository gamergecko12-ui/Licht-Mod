name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle wrapper
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: licht-jar
          path: build/libs/*.jar
